<!DOCTYPE html>
<html lang="id" data-theme="light" data-seed="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel — Aplikasi Spreadsheet</title>
<style>
/* ===== Material 3 tokens ===== */
:root{
  --p:#0B57D0; --on-p:#FFFFFF; --p-c:#D3E3FD; --on-p-c:#041E49;
  --s:#565E71; --on-s:#FFFFFF; --s-c:#DAE2F9; --on-s-c:#131C2B;
  --t:#6B5778; --on-t:#FFFFFF; --t-c:#F2DAFF; --on-t-c:#251431;
  --err:#BA1A1A; --on-err:#FFFFFF; --err-c:#FFDAD6; --on-err-c:#410002;
  --surf:#F8F9FF; --surf-dim:#D8DAE0; --surf-b:#FFFFFF;
  --surf-cl:#F2F3FA; --surf-c:#ECEEF4; --surf-ch:#E6E8EE; --surf-chh:#E0E2E8;
  --on-surf:#191C20; --on-surf-v:#44474E; --outline:#74777F; --outline-v:#C4C6D0;
  --inv-surf:#2E3036; --inv-on-surf:#EFF0F7; --inv-p:#AAC7FF;
  --scrim:rgba(0,0,0,.32);
}
html[data-theme="dark"]{
  --p:#AAC7FF; --on-p:#002F66; --p-c:#0842A0; --on-p-c:#D3E3FD;
  --s:#BEC6DC; --on-s:#283141; --s-c:#3E4759; --on-s-c:#DAE2F9;
  --t:#DDBCEE; --on-t:#3B2948; --t-c:#523F5F; --on-t-c:#F2DAFF;
  --err:#FFB4AB; --on-err:#690005; --err-c:#93000A; --on-err-c:#FFDAD6;
  --surf:#111318; --surf-b:#0B0E13; --surf-cl:#191C20; --surf-c:#1D2024; --surf-ch:#282A2F; --surf-chh:#33353A;
  --on-surf:#E2E2E9; --on-surf-v:#C4C6D0; --outline:#8E9099; --outline-v:#44474E;
  --inv-surf:#E2E2E9; --inv-on-surf:#2E3036; --scrim:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{overflow:hidden;font-family:"Segoe UI",Roboto,system-ui,sans-serif;background:var(--surf);color:var(--on-surf);font-size:14px}
#app{display:flex;flex-direction:column;height:100vh}
button{font:inherit;cursor:pointer}
select,input{font:inherit}

/* ===== Top app bar ===== */
.appbar{height:56px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--surf-b);border-bottom:1px solid var(--outline-v);flex-shrink:0}
.appbar .title{font-size:18px;font-weight:600;color:var(--on-surf);margin-right:8px;display:flex;align-items:center;gap:8px}
.appbar .title .dot{width:14px;height:14px;border-radius:3px;background:var(--p);display:inline-block}
.iconbtn{width:40px;height:40px;border-radius:50%;border:none;background:transparent;color:var(--on-surf-v);display:inline-flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.iconbtn:hover{background:var(--surf-ch)}
.spacer{flex:1}
.badge{font-size:12px;color:var(--on-surf-v);margin-right:4px}
.pillbtn{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--outline-v);background:var(--surf-b);color:var(--on-surf);display:inline-flex;align-items:center;gap:6px;font-weight:500;position:relative;overflow:hidden}
.pillbtn:hover{background:var(--surf-ch)}
.pillbtn.primary{background:var(--p);border-color:var(--p);color:var(--on-p)}
.pillbtn.primary:hover{filter:brightness(.96)}

/* ===== Formula bar ===== */
.fbar{height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--surf-b);border-bottom:1px solid var(--outline-v);flex-shrink:0}
.refbox{width:72px;text-align:center;font-weight:600;color:var(--on-surf);border:1px solid var(--outline-v);border-radius:6px;padding:5px 4px;background:var(--surf)}
.finput{flex:1;border:1px solid var(--outline-v);border-radius:6px;padding:5px 10px;background:var(--surf-b);color:var(--on-surf)}
.finput:focus{outline:2px solid var(--p-c);border-color:var(--p)}

/* ===== Grid ===== */
.gridwrap{flex:1;overflow:auto;background:var(--surf-cl);position:relative}
table.grid{border-collapse:separate;border-spacing:0;min-width:max-content;table-layout:fixed}
table.grid th,table.grid td{border-right:1px solid var(--outline-v);border-bottom:1px solid var(--outline-v);overflow:hidden;white-space:nowrap}
table.grid th{position:sticky;background:var(--surf-c);color:var(--on-surf-v);font-weight:600;font-size:12px;padding:6px;text-align:center;user-select:none}
table.grid th.corner{position:sticky;left:0;top:0;z-index:5;background:var(--surf-ch);border-right:1px solid var(--outline);border-bottom:1px solid var(--outline);width:40px;min-width:40px}
table.grid th.col{top:0;z-index:3}
table.grid th.rowh{position:sticky;left:0;z-index:2;background:var(--surf-c);color:var(--on-surf-v);font-weight:600;font-size:12px;border-bottom:1px solid var(--outline-v);text-align:center;user-select:none;width:40px;min-width:40px;cursor:pointer}
table.grid td{height:26px;min-width:92px;max-width:92px;padding:0 6px;background:var(--surf-b);color:var(--on-surf);font-size:13px;cursor:cell}
table.grid td.num{text-align:right}
table.grid td.selected{outline:2px solid var(--p);outline-offset:-2px;background:var(--p-c)}
table.grid td.cornerfill{position:absolute;width:6px;height:6px;background:var(--p);z-index:6}

/* ===== Status bar ===== */
.sbar{height:26px;display:flex;align-items:center;gap:16px;padding:0 12px;background:var(--surf-b);border-top:1px solid var(--outline-v);color:var(--on-surf-v);font-size:12px;flex-shrink:0}
.sbar b{color:var(--on-surf);font-weight:600}

/* ===== Ripple ===== */
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.16;transform:scale(0);animation:rip .55s cubic-bezier(.2,0,0,1) forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* ===== Dialog / snackbar ===== */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:50;display:none;align-items:flex-start;justify-content:center}
.overlay.open{display:flex}
.dialog{background:var(--surf-b);color:var(--on-surf);border-radius:16px;margin-top:14vh;min-width:320px;max-width:420px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.dialog h3{margin:0 0 8px;font-size:18px}
.dialog p{margin:0 0 12px;color:var(--on-surf-v);font-size:14px}
.dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dialog .actions button{border:none;border-radius:20px;padding:8px 16px;font-weight:600;background:var(--surf-ch);color:var(--p);position:relative;overflow:hidden}
.dialog .actions button.primary{background:var(--p);color:var(--on-p)}
#snack{position:fixed;left:50%;transform:translateX(-50%);bottom:48px;background:var(--inv-surf);color:var(--inv-on-surf);padding:12px 20px;border-radius:8px;font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80vw;text-align:center}
#snack.show{opacity:1}
input[type=file]{display:none}
.numbadge{position:absolute;top:2px;right:2px;font-size:9px;background:var(--err);color:#fff;border-radius:8px;padding:1px 4px;display:none}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B57D0">
</head>
