<body>
<div id="app">
  <!-- Top app bar -->
  <div class="appbar">
    <div class="title"><span class="dot"></span>Excel</div>
    <button class="iconbtn" data-act="new" title="Buku baru"><svg class="ico" width="22" height="22" viewBox="0 -960 960 960"><use href="#i-new"/></svg></button>
    <button class="iconbtn" data-act="open" title="Buka file .xlsx"><svg class="ico" width="22" height="22" viewBox="0 -960 960 960"><use href="#i-open"/></svg></button>
    <button class="iconbtn" data-act="save" title="Simpan / unduh"><svg class="ico" width="22" height="22" viewBox="0 -960 960 960"><use href="#i-save"/></svg></button>
    <span class="badge" id="fname">Buku tanpa judul</span>
    <span class="spacer"></span>
    <span class="badge" id="dirty" style="display:none;color:var(--err)">●</span>
    <button class="iconbtn" data-act="theme" title="Mode gelap/terang"><svg class="ico" width="22" height="22" viewBox="0 -960 960 960"><use href="#i-theme"/></svg></button>
  </div>
  <!-- Formula bar -->
  <div class="fbar">
    <input class="refbox" id="refbox" readonly value="A1">
    <input class="finput" id="finput" placeholder="Ketik = untuk formula, contoh =SUM(A1:A5)">
  </div>
  <!-- Grid -->
  <div class="gridwrap" id="gridwrap"><table class="grid" id="grid"></table></div>
  <!-- Status bar -->
  <div class="sbar"><span>Sel <b id="cur">-</b></span><span id="suminfo"></span></div>
</div>

<!-- Confirm dialog -->
<div class="overlay" id="ovConfirm">
  <div class="dialog">
    <h3 id="cfTitle">Konfirmasi</h3>
    <p id="cfBody"></p>
    <div class="actions">
      <button data-cf="no" id="cfNo">Batal</button>
      <button data-cf="yes" class="primary" id="cfYes">Simpan</button>
    </div>
  </div>
</div>

<div id="snack"></div>
<input type="file" id="file" accept=".xlsx,.xls,.csv">
